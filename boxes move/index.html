<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Boxes move</title>
  <link rel="stylesheet" href="css/style.css">
</head> 
<body>
  <div class="main">

    <div class="section">
      <div id="left_container" class="container">
        <div class="box box-red"></div>
        <div class="box box-gray"></div>
        <div class="box box-purple"></div>
      </div>
      <button id="btn-move-right" type="button">Move to right</button>
    </div>

    <div class="section">
      <div id="right_container" class="container">
        <div class="box box-brown"></div>
        <div class="box box-yellow"></div>
      </div>
      <button id="btn-move-left" type="button">Move to left</button>
    </div>

  </div>
   <script src="js/lib/jquery-3.7.1.min.js"></script>
  <script src="js/boxes_move.js"></script>
</body>
</html>
