<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>GitHub User Search</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="main">
    <h1>gitHub search</h1>

    <div class="search_box">
      <input type="text" id="username_input" placeholder="Enter a GitHub username">
      <button type="button" id="search_button">Search</button>
    </div>

    <p id="message"></p>

    <div id="users_list"></div>
  </div>

  <script src="js/github_search.js"></script>
</body>
</html>
